
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Expert Profile - KisanMitra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("images/farm-bg.jpg") no-repeat center center / cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 530px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .container h1 {
            color: #2e7d32;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .container input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .container input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .container button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .container button:hover {
            background: #1b5e20;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .container h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Complete Expert Profile</h1>

        <input type="text" id="specialization" placeholder="Specialization">
        <input type="number" id="experience" placeholder="Experience (Years)" min="0">
        <input type="text" id="qualification" placeholder="Qualification">
        <input type="text" id="location" placeholder="Location">
        <input type="tel" id="phone" placeholder="Phone Number">

        <button type="button" onclick="saveExpertProfile()">Save Profile</button>

        <p id="message" role="status"></p>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            alert("Please login first");
            window.location.href = "/login";
        }

        async function saveExpertProfile() {
            const specialization = document.getElementById("specialization").value.trim();
            const experience = document.getElementById("experience").value;
            const qualification = document.getElementById("qualification").value.trim();
            const location = document.getElementById("location").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const message = document.getElementById("message");

            if (!specialization || !experience || !qualification || !location || !phone) {
                message.innerText = "Please fill all fields";
                return;
            }

            message.innerText = "Saving profile...";

            try {
                const res = await fetch("/api/users/expert-profile", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_id: user.id,
                        specialization,
                        experience,
                        qualification,
                        location,
                        phone
                    })
                });

                const data = await res.json();
                message.innerText = data.message || (
                    res.ok ? "Profile saved successfully" : "Unable to save profile"
                );

                if (res.ok) {
                    setTimeout(() => {
                        window.location.href = "expert";
                    }, 1500);
                }
            } catch (error) {
                console.error("Error saving expert profile:", error);
                message.innerText = "Unable to connect to the server. Please try again.";
            }
        }
    </script>

</body>
</html>
