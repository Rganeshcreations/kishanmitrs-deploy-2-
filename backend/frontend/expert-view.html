
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Profile View - KisanMitra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(34,139,34,0.6), rgba(0,0,0,0.7)),
                url("images/farm-bg.jpg") center / cover fixed;
            color: white;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .left-panel {
            width: 300px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.6);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .left-panel img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }

        .right-panel {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .right-panel h1 {
            margin-top: 0;
        }

        .info-row {
            margin-bottom: 18px;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .edit-btn {
            background: white;
            color: green;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            margin-top: 20px;
        }

        .edit-btn:hover {
            background: #c8e6c9;
        }

        #status {
            margin-top: 15px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                padding: 20px;
            }

            .left-panel {
                width: 100%;
            }

            .right-panel {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="left-panel">
        <img src="images/ganesh.jpg" id="profileImage" alt="Expert profile">
        <h2 id="expertName">Expert</h2>
        <p id="expertLocation">Location not available</p>
    </div>

    <div class="right-panel">
        <h1>Expert Profile</h1>

        <p id="status" role="status">Loading expert profile...</p>

        <div class="info-row">
            Specialization: <span id="specialization">-</span>
        </div>

        <div class="info-row">
            Experience: <span id="experience">-</span>
        </div>

        <div class="info-row">
            Qualification: <span id="qualification">-</span>
        </div>

        <div class="info-row">
            Location: <span id="location">-</span>
        </div>

        <div class="info-row">
            Phone: <span id="phone">-</span>
        </div>

        <button class="edit-btn" onclick="editProfile()">Edit Profile</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", loadExpertProfile);

async function loadExpertProfile() {
    const status = document.getElementById("status");

    
const user = JSON.parse(localStorage.getItem("user") || "null");

const savedExpertId = localStorage.getItem("viewExpertId");
const savedExpertName = localStorage.getItem("viewExpertName");

// Prefer the selected expert; otherwise use the logged-in expert.
const userId =
    savedExpertId &&
    savedExpertId !== "null" &&
    savedExpertId !== "undefined"
        ? savedExpertId
        : user?.role === "expert"
            ? String(user.id)
            : null;

const userName =
    savedExpertName ||
    (user?.role === "expert" ? user.name : null);

if (!userId || userId === "undefined") {
    status.textContent =
        "Expert ID is missing. Please log in as an expert or open a profile from the expert list.";
    return;
}


    document.getElementById("expertName").textContent =
        userName || "Expert";

    try {
        const response = await fetch(
            "/api/users/expert-profile/" + encodeURIComponent(userId)
        );

        if (!response.ok) {
            status.textContent =
                "Could not load the profile. Server returned status " +
                response.status + ".";
            console.error("Expert profile API error:", response.status);
            return;
        }

        const profile = await response.json();

        console.log("Expert profile response:", profile);

        if (profile.exists === false) {
            status.textContent = "Expert profile not found. Please complete your profile.";
            return;
        }

        // Support either a direct profile object or a wrapped profile object.
        const details = profile.profile || profile.expertProfile || profile;

        document.getElementById("specialization").textContent =
            details.specialization ?? "-";

        document.getElementById("experience").textContent =
            details.experience ?? "-";

        document.getElementById("qualification").textContent =
            details.qualification ?? "-";

        document.getElementById("location").textContent =
            details.location ?? "-";

        document.getElementById("phone").textContent =
            details.phone ?? "-";

        document.getElementById("expertLocation").textContent =
            details.location ?? "Location not available";

        status.textContent = "Profile loaded successfully.";

    } catch (error) {
        console.error("Error loading expert profile:", error);
        status.textContent =
            "Unable to connect to the server. Please try again.";
    }
}

function editProfile() {
    window.location.href = "expert-profile";
}
</script>
</body>
</html>
