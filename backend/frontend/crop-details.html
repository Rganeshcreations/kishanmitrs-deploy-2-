<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Details - KisanMitra</title>

    <style>
        :root {
            --green: #2e7d32;
            --green-dark: #1b5e20;
            --green-light: #e8f5e9;
            --gold: #f9a825;
            --danger: #c62828;
            --text: #203127;
            --muted: #647368;
            --white: #ffffff;
            --border: #dce6dc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.66),
                    rgba(0, 0, 0, 0.76)
                ),
                url("images/farmer-bg.jpg") center center / cover fixed;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page-header {
            padding: 28px 20px 22px;
            color: white;
            text-align: center;
        }

        .page-header h1 {
            margin: 0;
            font-size: clamp(25px, 4vw, 34px);
            letter-spacing: 0.3px;
        }

        .page-header p {
            margin: 9px 0 0;
            color: #e0eee0;
            font-size: 15px;
        }

        .page-container {
            width: min(1120px, 94%);
            margin: 0 auto 40px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 20px;
        }

        .back-button {
            padding: 10px 17px;
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 10px;
            background: rgba(255,255,255,0.14);
            color: white;
            font-weight: 600;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.25);
        }

        .crop-label {
            color: white;
            font-size: 14px;
        }

        .crop-label strong {
            font-size: 18px;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .overview-card {
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 7px 22px rgba(0,0,0,0.15);
            border-top: 4px solid var(--green);
            min-width: 0;
        }

        .overview-card .label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .overview-card .value {
            color: var(--green-dark);
            font-size: clamp(18px, 2vw, 25px);
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .overview-card .subtext {
            margin-top: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .main-panel {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.24);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px;
            background: #f3f8f2;
            border-bottom: 1px solid var(--border);
        }

        .tab-button {
            flex: 1;
            min-width: 130px;
            padding: 13px 15px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #4d6251;
            font-weight: 650;
        }

        .tab-button:hover {
            background: #e3efe3;
        }

        .tab-button.active {
            color: white;
            background: var(--green);
            box-shadow: 0 3px 8px rgba(46,125,50,0.22);
        }

        .content-area {
            padding: 28px;
            min-height: 300px;
        }

        .section-heading {
            margin: 0 0 8px;
            color: var(--green-dark);
            font-size: 23px;
        }

        .section-description {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            min-width: 0;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            min-height: 45px;
            padding: 11px 13px;
            border: 1px solid #ccd8cc;
            border-radius: 9px;
            background: white;
            color: var(--text);
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(46,125,50,0.12);
        }

        .field-help {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .action-button {
            padding: 12px 21px;
            border: none;
            border-radius: 9px;
            background: var(--green);
            color: white;
            font-weight: 650;
            transition: background 0.2s;
        }

        .action-button:hover {
            background: var(--green-dark);
        }

        .action-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .secondary-button {
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: var(--text);
        }

        .status-message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 15px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
        }

        .status-message.success {
            display: block;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .status-message.error {
            display: block;
            background: #ffebee;
            color: #b71c1c;
        }

        .status-message.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
        }

        .expense-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .expense-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fbfdfb;
        }

        .expense-card h4 {
            margin: 0 0 6px;
            color: var(--text);
            text-transform: capitalize;
        }

        .expense-card p {
            margin: 4px 0;
            color: var(--muted);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .expense-amount {
            color: var(--danger);
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .empty-state {
            padding: 30px 15px;
            text-align: center;
            color: var(--muted);
            background: #f8fbf7;
            border: 1px dashed #cbd9cb;
            border-radius: 12px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: #fbfdfb;
        }

        .summary-card .label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .summary-card .amount {
            font-size: clamp(19px, 2.5vw, 27px);
            font-weight: 750;
            overflow-wrap: anywhere;
        }

        .summary-card.expenses .amount {
            color: #c62828;
        }

        .summary-card.revenue .amount {
            color: #1565c0;
        }

        .summary-card.profit .amount {
            color: var(--green-dark);
        }

        .summary-card.loss .amount {
            color: var(--danger);
        }

        .formula-note {
            padding: 16px;
            border-radius: 10px;
            background: #f3f8f2;
            color: #405342;
            font-size: 14px;
            line-height: 1.7;
        }

        .loading {
            padding: 45px 10px;
            text-align: center;
            color: var(--muted);
        }

        .page-footer {
            padding: 18px;
            text-align: center;
            color: #e3e9e3;
            font-size: 12px;
        }

        @media (max-width: 800px) {
            .overview-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .content-area {
                padding: 21px;
            }
        }

        @media (max-width: 520px) {
            .page-container {
                width: 94%;
            }

            .overview-grid {
                gap: 10px;
            }

            .overview-card {
                padding: 14px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .tabs {
                gap: 4px;
            }

            .tab-button {
                min-width: 0;
                padding: 11px 8px;
                font-size: 13px;
            }

            .expense-card {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="page-header">
    <h1>Crop Management</h1>
    <p>Manage production, track expenditures and review your crop finances.</p>
</header>

<main class="page-container">

    <div class="top-bar">
        <button class="back-button" type="button" onclick="goBack()">
            Back to My Crops
        </button>

        <div class="crop-label">
            Current Crop:
            <strong id="topCropName">Loading...</strong>
        </div>
    </div>

    <section class="overview-grid" aria-label="Crop overview">
        <article class="overview-card">
            <div class="label">Crop Name</div>
            <div class="value" id="overviewCropName">Loading...</div>
            <div class="subtext">Selected crop</div>
        </article>

        <article class="overview-card">
            <div class="label">Seeding Date</div>
            <div class="value" id="overviewDate">-</div>
            <div class="subtext">Date of planting</div>
        </article>

        <article class="overview-card">
            <div class="label">Days Passed</div>
            <div class="value" id="overviewDays">-</div>
            <div class="subtext">Since seeding</div>
        </article>

        <article class="overview-card">
            <div class="label">Land Size</div>
            <div class="value" id="overviewLand">-</div>
            <div class="subtext">Land area in acres</div>
        </article>
    </section>

    <section class="main-panel">

        <nav class="tabs" aria-label="Crop management sections">
            <button class="tab-button active" id="detailsTab"
                    type="button" aria-selected="true"
                    onclick="showTab('details')">
                Crop Production
            </button>

            <button class="tab-button" id="expenseTab"
                    type="button" aria-selected="false"
                    onclick="showTab('expense')">
                Expenditures
            </button>

            <button class="tab-button" id="summaryTab"
                    type="button" aria-selected="false"
                    onclick="showTab('summary')">
                Financial Summary
            </button>
        </nav>

        <div class="content-area" id="contentArea">
            <div class="loading">Loading crop information...</div>
        </div>

    </section>

</main>

<footer class="page-footer">
    KisanMitra - Crop Management
</footer>

<script>
"use strict";

const urlParams = new URLSearchParams(window.location.search);
const cropId = urlParams.get("crop_id");

let cropData = {};
let expenses = [];
let currentTab = "details";

const contentArea = document.getElementById("contentArea");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (character) {
        const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };
        return entities[character];
    });
}

function formatCurrency(value) {
    const amount = Number(value) || 0;

    return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }).format(amount);
}

function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "-";

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function getDaysPassed(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "-";

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    date.setHours(0, 0, 0, 0);

    const difference = Math.floor(
        (today.getTime() - date.getTime()) / 86400000
    );

    if (difference < 0) return "Not started";

    return difference + (difference === 1 ? " day" : " days");
}

function showMessage(message, type) {
    const element = document.getElementById("statusMessage");

    if (!element) return;

    element.textContent = message;
    element.className = "status-message " + type;
}

function clearMessage() {
    const element = document.getElementById("statusMessage");

    if (element) {
        element.textContent = "";
        element.className = "status-message";
    }
}

async function readResponse(response) {
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(
            data.message || data.error ||
            "Request failed with status " + response.status
        );
    }

    return data;
}

function setActiveTab(tab) {
    currentTab = tab;

    const tabs = {
        details: "detailsTab",
        expense: "expenseTab",
        summary: "summaryTab"
    };

    Object.entries(tabs).forEach(([name, id]) => {
        const button = document.getElementById(id);
        const active = name === tab;

        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
    });
}

async function showTab(tab) {
    if (!cropId) return;

    setActiveTab(tab);

    if (tab === "details") {
        renderDetails();
    } else if (tab === "expense") {
        renderExpense();
    } else if (tab === "summary") {
        await renderSummary();
    }
}

function updateOverview() {
    const name = cropData.crop_name || "Crop";

    document.getElementById("topCropName").textContent = name;
    document.getElementById("overviewCropName").textContent = name;
    document.getElementById("overviewDate").textContent =
        formatDate(cropData.seeding_date);
    document.getElementById("overviewDays").textContent =
        getDaysPassed(cropData.seeding_date);

    const landSize = Number(cropData.land_size);

    document.getElementById("overviewLand").textContent =
        cropData.land_size !== null &&
        cropData.land_size !== undefined &&
        cropData.land_size !== ""
            ? (Number.isFinite(landSize) ? landSize + " acres" : "-")
            : "-";
}

async function loadCrop() {
    if (!cropId) {
        contentArea.innerHTML = `
            <div class="status-message error" style="display:block">
                No crop ID was provided. Return to My Crops and select a crop.
            </div>
        `;

        document.getElementById("topCropName").textContent = "Unavailable";
        document.getElementById("overviewCropName").textContent = "-";
        return false;
    }

    try {
        const response = await fetch(
            "/api/users/get-crop/" + encodeURIComponent(cropId)
        );

        const data = await readResponse(response);

        // Support a direct crop object or a common wrapped response.
        cropData = data.crop || data.data || data;

        if (!cropData || !cropData.crop_name) {
            throw new Error("Crop information was not found.");
        }

        updateOverview();

        return true;

    } catch (error) {
        console.error("Failed to load crop:", error);

        contentArea.innerHTML = `
            <div class="status-message error" style="display:block">
                ${escapeHTML(error.message)}
            </div>
            <button class="action-button" onclick="loadCrop().then(ok => {
                if (ok) showTab(currentTab);
            })">
                Try Again
            </button>
        `;

        return false;
    }
}

async function loadExpenses() {
    const response = await fetch(
        "/api/users/get-expenditures/" + encodeURIComponent(cropId)
    );

    const data = await readResponse(response);

    expenses = Array.isArray(data)
        ? data
        : Array.isArray(data.expenses)
            ? data.expenses
            : Array.isArray(data.data)
                ? data.data
                : [];

    return expenses;
}

function renderDetails() {
    contentArea.innerHTML = `
        <h2 class="section-heading">Production Details</h2>
        <p class="section-description">
            Record your harvested quantity and expected selling price.
            These values are used to calculate your crop revenue.
        </p>

        <div id="statusMessage" class="status-message"></div>

        <form id="productionForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="quantity">Quantity Produced</label>
                    <input type="number" id="quantity" min="0" step="any"
                           placeholder="Enter quantity"
                           value="${escapeHTML(cropData.quantity_produced ?? "")}"
                           required>
                    <span class="field-help">
                        Enter the quantity harvested in your preferred unit.
                    </span>
                </div>

                <div class="form-group">
                    <label for="price">Selling Price Per Unit (INR)</label>
                    <input type="number" id="price" min="0" step="any"
                           placeholder="Enter price per unit"
                           value="${escapeHTML(cropData.selling_price ?? "")}"
                           required>
                    <span class="field-help">
                        Use the same unit as your production quantity.
                    </span>
                </div>
            </div>

            <div class="form-actions">
                <button class="action-button" id="saveProductionButton"
                        type="submit">
                    Save Production Details
                </button>
                <button class="secondary-button" type="button"
                        onclick="showTab('summary')">
                    View Financial Summary
                </button>
            </div>
        </form>
    `;

    document.getElementById("productionForm").addEventListener(
        "submit",
        updateProduction
    );
}

async function updateProduction(event) {
    event.preventDefault();

    const quantityInput = document.getElementById("quantity");
    const priceInput = document.getElementById("price");

    const quantity = quantityInput.value.trim();
    const price = priceInput.value.trim();

    if (
        quantity === "" ||
        price === "" ||
        !Number.isFinite(Number(quantity)) ||
        !Number.isFinite(Number(price)) ||
        Number(quantity) < 0 ||
        Number(price) < 0
    ) {
        showMessage(
            "Enter a valid non-negative quantity and selling price.",
            "error"
        );
        return;
    }

    const button = document.getElementById("saveProductionButton");
    button.disabled = true;
    button.textContent = "Saving...";

    try {
        const response = await fetch(
            "/api/users/update-production/" + encodeURIComponent(cropId),
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    quantity_produced: Number(quantity),
                    selling_price: Number(price)
                })
            }
        );

        const data = await readResponse(response);

        showMessage(
            data.message || "Production details saved successfully.",
            "success"
        );

        // Refresh the saved values from the backend.
        const cropLoaded = await loadCrop();

        if (cropLoaded) {
            await showTab("summary");
        }

    } catch (error) {
        console.error("Production update failed:", error);
        showMessage(error.message || "Unable to save production details.", "error");
    } finally {
        const saveButton = document.getElementById("saveProductionButton");

        if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent = "Save Production Details";
        }
    }
}

function renderExpense() {
    contentArea.innerHTML = `
        <h2 class="section-heading">Expenditure Management</h2>
        <p class="section-description">
            Track labour, fertilizer and other costs associated with this crop.
        </p>

        <div id="statusMessage" class="status-message"></div>

        <form id="expenseForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="expenseType">Expense Category</label>
                    <select id="expenseType" required>
                        <option value="worker">Labour / Worker</option>
                        <option value="fertilizer">Fertilizer</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (INR)</label>
                    <input type="number" id="amount" min="0.01" step="0.01"
                           placeholder="Enter amount" required>
                </div>

                <div class="form-group full-width">
                    <label for="desc">Description</label>
                    <input type="text" id="desc" maxlength="250"
                           placeholder="Example: Fertilizer purchase"
                           required>
                </div>

                <div class="form-group">
                    <label for="date">Expense Date</label>
                    <input type="date" id="date" required>
                </div>
            </div>

            <div class="form-actions">
                <button class="action-button" id="addExpenseButton" type="submit">
                    Add Expenditure
                </button>
            </div>
        </form>

        <hr style="border:0;border-top:1px solid #dce6dc;margin:30px 0">

        <h2 class="section-heading">Recorded Expenditures</h2>
        <p class="section-description">
            Review the expenses recorded for this crop.
        </p>

        <div id="expenseList" class="expense-list">
            <div class="loading">Loading expenditures...</div>
        </div>
    `;

    const dateInput = document.getElementById("date");
    dateInput.value = new Date().toLocaleDateString("en-CA");

    document.getElementById("expenseForm").addEventListener(
        "submit",
        addExpense
    );

    refreshExpenseList();
}

async function refreshExpenseList() {
    const list = document.getElementById("expenseList");

    if (!list) return;

    list.innerHTML = `<div class="loading">Loading expenditures...</div>`;

    try {
        await loadExpenses();
        displayExpenses();
    } catch (error) {
        console.error("Unable to load expenditures:", error);

        list.innerHTML = `
            <div class="empty-state">
                Unable to load expenditures.
                <button class="secondary-button" type="button"
                        onclick="refreshExpenseList()">
                    Try Again
                </button>
            </div>
        `;
    }
}

async function addExpense(event) {
    event.preventDefault();

    const type = document.getElementById("expenseType").value;
    const desc = document.getElementById("desc").value.trim();
    const amount = document.getElementById("amount").value;
    const date = document.getElementById("date").value;

    if (
        !desc ||
        !amount ||
        !date ||
        !Number.isFinite(Number(amount)) ||
        Number(amount) <= 0
    ) {
        showMessage(
            "Enter a description, a valid amount greater than zero, and a date.",
            "error"
        );
        return;
    }

    const button = document.getElementById("addExpenseButton");
    button.disabled = true;
    button.textContent = "Saving...";

    try {
        const response = await fetch("/api/users/add-expenditure", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                crop_id: cropId,
                expense_category: type,
                description: desc,
                total_amount: Number(amount),
                expense_date: date
            })
        });

        const data = await readResponse(response);

        showMessage(
            data.message || "Expenditure added successfully.",
            "success"
        );

        document.getElementById("desc").value = "";
        document.getElementById("amount").value = "";

        await loadExpenses();
        displayExpenses();

    } catch (error) {
        console.error("Unable to add expenditure:", error);
        showMessage(error.message || "Unable to add expenditure.", "error");
    } finally {
        const addButton = document.getElementById("addExpenseButton");

        if (addButton) {
            addButton.disabled = false;
            addButton.textContent = "Add Expenditure";
        }
    }
}

function displayExpenses() {
    const list = document.getElementById("expenseList");

    if (!list) return;

    if (expenses.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                No expenditures recorded yet.
                Add your first expense using the form above.
            </div>
        `;
        return;
    }

    list.innerHTML = expenses.map(function (expense) {
        const category = String(expense.expense_category || "other");
        const description = String(expense.description || "No description");
        const date = formatDate(expense.expense_date);

        return `
            <article class="expense-card">
                <div>
                    <h4>${escapeHTML(category)}</h4>
                    <p>${escapeHTML(description)}</p>
                    <p>Expense date: ${escapeHTML(date)}</p>
                </div>
                <div class="expense-amount">
                    ${escapeHTML(formatCurrency(expense.total_amount))}
                </div>
            </article>
        `;
    }).join("");
}

async function renderSummary() {
    contentArea.innerHTML = `
        <h2 class="section-heading">Financial Summary</h2>
        <p class="section-description">
            Review estimated crop revenue, recorded expenses and the resulting profit or loss.
        </p>
        <div class="loading">Calculating financial summary...</div>
    `;

    try {
        await loadExpenses();

        const quantity = Number(cropData.quantity_produced) || 0;
        const price = Number(cropData.selling_price) || 0;

        const totalExpense = expenses.reduce(function (total, expense) {
            return total + (Number(expense.total_amount) || 0);
        }, 0);

        const revenue = quantity * price;
        const profit = revenue - totalExpense;
        const isProfit = profit >= 0;

        contentArea.innerHTML = `
            <h2 class="section-heading">Financial Summary</h2>
            <p class="section-description">
                Calculations use the production details and expenditures currently saved for this crop.
            </p>

            <div id="statusMessage" class="status-message"></div>

            <div class="summary-grid">
                <article class="summary-card expenses">
                    <div class="label">Total Expenditures</div>
                    <div class="amount">${escapeHTML(formatCurrency(totalExpense))}</div>
                </article>

                <article class="summary-card revenue">
                    <div class="label">Estimated Revenue</div>
                    <div class="amount">${escapeHTML(formatCurrency(revenue))}</div>
                </article>

                <article class="summary-card ${isProfit ? "profit" : "loss"}">
                    <div class="label">${isProfit ? "Estimated Profit" : "Estimated Loss"}</div>
                    <div class="amount">${escapeHTML(formatCurrency(Math.abs(profit)))}</div>
                </article>
            </div>

            <div class="formula-note">
                <strong>Calculation details</strong><br>
                Quantity produced: ${escapeHTML(quantity)}<br>
                Selling price per unit: ${escapeHTML(formatCurrency(price))}<br>
                Revenue = Quantity x Selling price<br>
                Profit or loss = Revenue - Total expenditures
            </div>

            <div class="form-actions">
                <button class="action-button" type="button"
                        onclick="showTab('details')">
                    Update Production
                </button>

                <button class="secondary-button" type="button"
                        onclick="showTab('expense')">
                    Manage Expenditures
                </button>
            </div>
        `;

    } catch (error) {
        console.error("Unable to calculate financial summary:", error);

        contentArea.innerHTML = `
            <h2 class="section-heading">Financial Summary</h2>
            <div class="status-message error" style="display:block">
                Unable to load expenditures, so the financial summary cannot be calculated.
                ${escapeHTML(error.message)}
            </div>
            <button class="action-button" type="button"
                    onclick="renderSummary()">
                Try Again
            </button>
        `;
    }
}

function goBack() {
    window.location.href = "crop-list";
}

// Initial page load.
(async function init() {
    const loaded = await loadCrop();

    if (loaded) {
        await showTab("details");
    }
})();
</script>
