
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Dashboard - KisanMitra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(34, 139, 34, 0.55), rgba(0, 0, 0, 0.65)),
        url("images/farmer-bg.jpg") center / cover fixed no-repeat;
      color: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: rgba(0, 100, 0, 0.95);
      position: fixed;
      top: 0;
      left: 0;
      padding: 25px 10px;
      z-index: 10;
    }

    .sidebar h3 {
      text-align: center;
      margin: 20px 0 30px;
      font-size: 21px;
    }

    .sidebar button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 13px 8px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #2e7d32;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .sidebar button:hover {
      background: #e8f5e9;
      transform: translateX(3px);
    }

    /* MAIN CONTENT */
    .content {
      margin-left: 240px;
      padding: 35px;
      min-height: 100vh;
    }

    .welcome {
      margin: 15px 0 25px;
      padding-right: 150px;
      font-size: 26px;
      line-height: 1.4;
    }

    /* PROFILE */
    .profile {
      position: absolute;
      top: 18px;
      right: 25px;
      width: 120px;
      text-align: center;
      z-index: 5;
    }

    .profile img {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 3px solid white;
      object-fit: cover;
      cursor: pointer;
    }

    #farmerName {
      margin: 5px 0;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .logout {
      margin-top: 5px;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      background: #d32f2f;
      color: white;
      cursor: pointer;
    }

    .logout:hover {
      background: #b71c1c;
    }

    /* DASHBOARD CARDS */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      min-height: 140px;
      padding: 22px 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.20);
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
    }

    .card p {
      margin: 10px 0 18px;
      font-size: 16px;
    }

    .card h2 {
      margin: 0;
      font-size: 27px;
      overflow-wrap: anywhere;
    }

    .profit {
      color: #a5ffb0;
    }

    .loss {
      color: #ff8a80;
    }

    #message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    /* RESPONSIVE LAYOUT */
    @media (max-width: 1100px) {
      .dashboard {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 12px;
      }

      .sidebar h3 {
        margin: 10px 0 15px;
      }

      .sidebar button {
        width: 100%;
        margin: 8px 0;
      }

      .content {
        margin-left: 0;
        padding: 20px;
      }

      .profile {
        position: relative;
        top: auto;
        right: auto;
        width: 100%;
        padding: 15px;
      }

      .welcome {
        margin-top: 10px;
        padding-right: 0;
        font-size: 23px;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>🌾 Farmer Panel</h3>

    <button onclick="navigateTo('crop-list')">🌱 Crop Data</button>
    <button onclick="navigateTo('weather')">🌦️ Weather</button>
    <button onclick="navigateTo('ask-options')">👨‍🌾 Ask Expert</button>
    <button onclick="navigateTo('farmer-answers')">📩 My Questions</button>
    <button onclick="navigateTo('farmer-schemes')">🏛️ Schemes</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">
    <h1 class="welcome">Welcome to KisanMitra Dashboard 🌾</h1>

    <section class="dashboard" aria-label="Farmer statistics">
      <div class="card">
        <p>🌱 Total Crops</p>
        <h2 id="totalCrops">—</h2>
      </div>

      <div class="card">
        <p>💸 Total Expense</p>
        <h2 id="totalExpense">—</h2>
      </div>

      <div class="card">
        <p>💰 Total Revenue</p>
        <h2 id="totalRevenue">—</h2>
      </div>

      <div class="card">
        <p>📊 Profit / Loss</p>
        <h2 id="profit">—</h2>
      </div>
    </section>

    <p id="message" role="status" hidden></p>
  </main>

  <!-- PROFILE -->
  <div class="profile">
    <img
      src="images/ganesh.jpg"
      alt="Farmer profile"
      onclick="openProfile()"
      onerror="this.onerror=null; this.src='images/farmer-bg.jpg';"
    >

    <p id="farmerName">Farmer</p>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <script>
    // Use the saved login session.
    let user = null;

    try {
      user = JSON.parse(localStorage.getItem("user"));
    } catch (error) {
      console.error("Unable to read saved user:", error);
    }

    if (!user || !user.id) {
      window.location.href = "/login";
    } else {
      document.getElementById("farmerName").textContent =
        user.name || "Farmer";

      loadDashboard();
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function openProfile() {
      window.location.href = "farmer-view";
    }

    function showMessage(text) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.hidden = false;
    }

    function formatRupees(value) {
      const amount = Number(value);

      if (!Number.isFinite(amount)) {
        return "₹ 0.00";
      }

      return "₹ " + amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    async function loadDashboard() {
      try {
        const response = await fetch(
          "/api/users/farmer-dashboard/" + encodeURIComponent(user.id)
        );

        if (!response.ok) {
          throw new Error("Dashboard API returned HTTP " + response.status);
        }

        const data = await response.json();

        document.getElementById("totalCrops").textContent =
          Number(data.totalCrops ?? 0).toLocaleString("en-IN");

        document.getElementById("totalExpense").textContent =
          formatRupees(data.totalExpense);

        document.getElementById("totalRevenue").textContent =
          formatRupees(data.totalRevenue);

        const profitElement = document.getElementById("profit");
        const profitValue = Number(data.profit ?? 0);

        profitElement.textContent = formatRupees(profitValue);
        profitElement.classList.remove("profit", "loss");
        profitElement.classList.add(
          profitValue >= 0 ? "profit" : "loss"
        );

        document.getElementById("message").hidden = true;
      } catch (error) {
        console.error("Failed to load farmer dashboard:", error);
        showMessage(
          "Could not load dashboard statistics. Please refresh the page or try again later."
        );
      }
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "/login";
    }
  </script>

</body>
</html>
